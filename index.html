<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目记账管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .page { display: none; padding-bottom: 80px; }
        .page.active { display: block; }
        .nav-item { transition: all 0.2s; }
        .nav-item.active { color: #3b82f6; }
        input[type="date"], input[type="time"], input[type="number"], select, textarea {
            border: 1px solid #d1d5db; border-radius: 0.375rem; padding: 0.5rem; width: 100%;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .card { transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-2xl mx-auto bg-white min-h-screen shadow-lg">
        
        <!-- 页面1：总览 -->
        <div id="page-overview" class="page active">
            <div class="bg-gray-900 text-white p-6">
                <h1 class="text-2xl font-bold mb-4">项目记账管理系统</h1>
                <div class="bg-white rounded-lg p-4 text-gray-800 shadow-md">
                    <h2 class="text-sm font-semibold text-gray-600 mb-3">总体概况</h2>
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div><div class="text-xs text-gray-500">总预算</div><div class="text-lg font-bold text-blue-600" id="overview-total-budget">¥0</div></div>
                        <div><div class="text-xs text-gray-500">总已用</div><div class="text-lg font-bold text-red-600" id="overview-total-used">¥0</div></div>
                        <div><div class="text-xs text-gray-500">总剩余</div><div class="text-lg font-bold text-green-600" id="overview-total-remaining">¥0</div></div>
                    </div>
                </div>
            </div>
            <div class="p-4 space-y-4" id="project-list"></div>
        </div>

        <!-- 页面2：项目详情 -->
        <div id="page-detail" class="page">
            <div class="bg-gray-900 text-white p-4 sticky top-0 z-10">
                <div class="flex items-center justify-between">
                    <button onclick="showPage('overview')" class="text-white hover:text-blue-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <h2 id="detail-project-name" class="text-xl font-bold">项目详情</h2>
                    <button onclick="currentProjectId=null;showPage('detail')" class="text-yellow-300 text-sm hover:text-yellow-100 font-semibold">⚠️ 预警</button>
                </div>
            </div>
            <div class="p-4 space-y-4" id="detail-content"></div>
        </div>

        <!-- 页面3：录入支出 -->
        <div id="page-entry" class="page">
            <div class="bg-gray-900 text-white p-6"><h1 class="text-2xl font-bold">录入支出</h1></div>
            <div class="p-4 space-y-4">
                <form id="expense-form" onsubmit="handleExpenseSubmit(event)">
                    <div class="space-y-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">项目 *</label><select id="entry-project" required onchange="updateEntryFormFields()"><option value="">请选择项目</option></select></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">日期</label><input type="date" id="entry-date" required></div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">类目 *</label>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50"><input type="radio" name="category" value="production" required class="mr-2"><span class="text-sm">制作费</span></label>
                                <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50"><input type="radio" name="category" value="travel_cctv" class="mr-2"><span class="text-sm">差旅央视网</span></label>
                                <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50"><input type="radio" name="category" value="travel_camera" class="mr-2"><span class="text-sm">差旅摄像团队</span></label>
                                <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50"><input type="radio" name="category" value="transport" class="mr-2"><span class="text-sm">北京交通费</span></label>
                            </div>
                        </div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">金额 *</label><input type="text" id="entry-amount" required placeholder="0.00 或 120+80" onblur="evalAmount(this);updateBudgetHint()" oninput="updateBudgetHint()" inputmode="decimal"><div id="entry-budget-hint" class="text-xs mt-1 hidden"></div></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">备注</label><textarea id="entry-description" rows="2" placeholder="可选"></textarea></div>
                        <!-- 默认状态字段（非交通费） -->
                        <div id="status-default" class="space-y-2">
                            <div class="flex items-center flex-wrap gap-2">
                                <label class="flex items-center"><input type="checkbox" id="entry-invoice" checked class="mr-2" onchange="onInvoiceChange()"><span class="text-sm">已收票</span></label>
                                <input type="date" id="entry-expected-pay-date" class="hidden text-xs border border-gray-300 rounded px-2 py-1" title="预计付款日期">
                                <span id="entry-expected-pay-label" class="hidden text-xs text-gray-400">预计付款日</span>
                            </div>
                            <div class="flex items-center flex-wrap gap-2">
                                <label class="flex items-center"><input type="checkbox" id="entry-paid" class="mr-2" onchange="onPaidChange()"><span class="text-sm">已付款</span></label>
                                <input type="date" id="entry-paid-date" class="hidden text-xs border border-gray-300 rounded px-2 py-1" title="实际付款日期">
                                <span id="entry-paid-date-label" class="hidden text-xs text-gray-400">付款日期</span>
                            </div>
                            <label class="flex items-center hidden" id="entry-reimbursed-vendor-label"><input type="checkbox" id="entry-reimbursed-vendor" class="mr-2"><span class="text-sm">已向制作方报销</span></label>
                            <label class="flex items-center hidden" id="entry-reimbursed-me-label"><input type="checkbox" id="entry-reimbursed-me" class="mr-2"><span class="text-sm">已报销给我</span></label>
                        </div>
                        <!-- 差旅央视网专用状态字段（向公司报销） -->
                        <div id="status-travel-cctv" class="space-y-2 hidden">
                            <label class="flex items-center"><input type="checkbox" id="entry-cctv-invoice" class="mr-2"><span class="text-sm">已收票</span></label>
                            <label class="flex items-center"><input type="checkbox" id="entry-cctv-filed" class="mr-2"><span class="text-sm">已填报</span></label>
                            <label class="flex items-center"><input type="checkbox" id="entry-cctv-submitted" class="mr-2"><span class="text-sm">已提交</span></label>
                            <label class="flex items-center"><input type="checkbox" id="entry-cctv-reimbursed" class="mr-2"><span class="text-sm">已完成报销</span></label>
                        </div>
                        <!-- 北京交通费专用状态字段（向公司报销） -->
                        <div id="status-transport" class="space-y-2 hidden">
                            <label class="flex items-center"><input type="checkbox" id="entry-transport-filed" class="mr-2"><span class="text-sm">已填报</span></label>
                            <label class="flex items-center"><input type="checkbox" id="entry-transport-submitted" class="mr-2"><span class="text-sm">已提交</span></label>
                            <label class="flex items-center"><input type="checkbox" id="entry-transport-reimbursed" class="mr-2"><span class="text-sm">已完成报销</span></label>
                        </div>
                        <div class="hidden" id="entry-route-container"><label class="block text-sm font-medium text-gray-700 mb-1">交通路线（起点→终点）</label><input type="text" id="entry-route" placeholder="例如：望海楼→融创亦庄壹号"></div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">提交录入</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 页面4：打车规划 -->
        <div id="page-taxi" class="page">
            <div class="bg-gray-900 text-white p-6"><h1 class="text-2xl font-bold">打车规划</h1></div>
            <div class="p-4 space-y-4">
                <div class="bg-gray-50 p-4 rounded-lg space-y-3">
                    <h3 class="font-semibold text-gray-700">行程信息</h3>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">日期</label><input type="date" id="taxi-date" onchange="generateTaxiSuggestion()"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">时间</label><input type="time" id="taxi-time" onchange="generateTaxiSuggestion()"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">起点</label><input type="text" id="taxi-from" placeholder="如：望海楼（公司）" list="taxi-from-list" onchange="generateTaxiSuggestion()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"><datalist id="taxi-from-list"></datalist></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">终点</label><input type="text" id="taxi-to" placeholder="如：融创亦庄壹号（家）" list="taxi-to-list" onchange="generateTaxiSuggestion()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"><datalist id="taxi-to-list"></datalist></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">预估金额</label><input type="text" id="taxi-amount" placeholder="0.00 或 120+80" onblur="evalAmount(this)" onchange="generateTaxiSuggestion()" inputmode="decimal"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">里程（公里）</label><input type="number" id="taxi-mileage" placeholder="0.0" step="0.1" min="0" inputmode="decimal" onchange="suggestDestinationByMileage()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></div>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">备注（详细理由）</label><textarea id="taxi-note" placeholder="例如：拜访客户张三，讨论Q3合作方案" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm resize-none"></textarea></div>
                </div>
                <div id="taxi-suggestion" class="bg-blue-50 p-4 rounded-lg space-y-3 hidden">
                    <h3 class="font-semibold text-blue-800">智能建议</h3>
                    <div class="space-y-2 text-sm">
                        <div><span class="font-medium">规则判断：</span><span id="taxi-rule-text"></span></div>
                        <div><span class="font-medium">推荐路线：</span><span id="taxi-route-text"></span></div>
                        <div><span class="font-medium">报销理由：</span><span id="taxi-reason-text"></span></div>
                        <div><span class="font-medium">推荐分配项目：</span><select id="taxi-project-select" class="mt-1 w-full"><option value="">请选择项目</option></select></div>
                    </div>
                    <div class="pt-2"><label class="flex items-center"><input type="checkbox" id="taxi-is-workday" checked class="mr-2" onchange="generateTaxiSuggestion()"><span class="text-sm">视为工作日（可手动调整）</span></label></div>
                    <button onclick="confirmTaxiEntry()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition mt-2">确认录入</button>
                </div>
                <div class="bg-white border rounded-lg p-4">
                    <div class="flex justify-between items-center mb-3 cursor-pointer" onclick="toggleTaxiHistory()">
                        <h3 class="font-semibold text-gray-700">📋 今日已录入记录（点击展开/收起）</h3>
                        <span id="taxi-history-count" class="text-sm bg-blue-100 text-blue-800 px-2 py-1 rounded-full">0条</span>
                    </div>
                    <div id="taxi-history-panel" class="hidden space-y-2 max-h-64 overflow-y-auto"></div>
                </div>
                <div class="bg-white border rounded-lg p-4">
                    <div class="flex justify-between items-center mb-3"><h3 class="font-semibold text-gray-700">常用路线记录</h3><button onclick="showAddRouteModal()" class="text-blue-600 text-sm hover:underline">+ 新增</button></div>
                    <div id="taxi-routes-list" class="space-y-2"></div>
                    <button onclick="exportTaxiExcel()" class="w-full mt-3 bg-emerald-600 text-white py-2 rounded-lg hover:bg-emerald-700 transition text-sm">📊 导出打车数据 Excel</button>
                </div>
            </div>
        </div>

        <!-- 页面5：设置 -->
        <div id="page-settings" class="page">
            <div class="bg-gray-900 text-white p-6"><h1 class="text-2xl font-bold">设置</h1></div>
            <div class="p-4 space-y-6">
                <div class="bg-white border rounded-lg p-4">
                    <h3 class="font-semibold text-gray-700 mb-3">项目管理</h3>
                    <div id="settings-projects-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
                    <button onclick="showAddProjectModal()" class="w-full mt-3 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">+ 新增项目</button>
                </div>
                <div class="bg-white border rounded-lg p-4">
                    <h3 class="font-semibold text-gray-700 mb-3">数据备份与同步</h3>
                    <button onclick="shareDataAirdrop()" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition mb-2 font-semibold">📲 发送到 iPhone（AirDrop）</button>
                    <p class="text-xs text-gray-500 mb-3">点击后选择 AirDrop → 你的 iPhone，在 iPhone 上用 Safari 打开，然后点「导入数据」即可同步</p>
                    <button onclick="exportExcel()" class="w-full bg-emerald-600 text-white py-2 rounded-lg hover:bg-emerald-700 transition mb-2">📊 导出 Excel 表格</button>
                    <button onclick="exportData()" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition mb-2">📥 导出数据（JSON 文件）</button>
                    <div class="relative"><input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)"><button onclick="document.getElementById('import-file').click()" class="w-full bg-yellow-600 text-white py-2 rounded-lg hover:bg-yellow-700 transition">📤 导入数据（JSON 文件）</button></div>
                </div>
                <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                    <h3 class="font-semibold text-red-700 mb-2">⚠️ 危险操作</h3>
                    <p class="text-sm text-red-600 mb-3">此操作将永久删除所有数据，不可恢复！</p>
                    <button onclick="clearAllData()" class="w-full bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition">清空所有数据</button>
                </div>
            </div>
        </div>

        <!-- 底部导航栏 -->
        <div class="fixed bottom-0 left-0 right-0 bg-gray-900 text-gray-400 border-t border-gray-700 max-w-2xl mx-auto">
            <div class="flex justify-around py-2">
                <button onclick="showPage('overview')" class="nav-item flex flex-col items-center p-2 active" data-page="overview"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg><span class="text-xs mt-1">总览</span></button>
                <button onclick="showPage('detail')" class="nav-item flex flex-col items-center p-2" data-page="detail"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><span class="text-xs mt-1">详情</span></button>
                <button onclick="showPage('entry')" class="nav-item flex flex-col items-center p-2" data-page="entry"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg><span class="text-xs mt-1">录入</span></button>
                <button onclick="showPage('taxi')" class="nav-item flex flex-col items-center p-2" data-page="taxi"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg><span class="text-xs mt-1">打车</span></button>
                <button onclick="showPage('settings')" class="nav-item flex flex-col items-center p-2" data-page="settings"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span class="text-xs mt-1">设置</span></button>
            </div>
        </div>
    </div>

    <!-- 模态框 -->
    <div id="edit-project-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg max-w-md w-full max-h-[90vh] overflow-y-auto p-6">
            <h3 class="text-xl font-bold mb-4">编辑项目</h3>
            <form id="edit-project-form" onsubmit="handleEditProjectSubmit(event)">
                <input type="hidden" id="edit-project-id">
                <div class="space-y-3">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">项目名称</label><input type="text" id="edit-project-name" required></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">项目类型</label><select id="edit-project-type" required><option value="A">A类</option><option value="B">B类</option></select></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">制作费预算</label><input type="number" id="edit-project-budget-production" step="0.01" min="0" required></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">差旅（央视网）预算</label><input type="number" id="edit-project-budget-travel-cctv" step="0.01" min="0" required></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">北京交通费预算</label><input type="number" id="edit-project-budget-transport" step="0.01" min="0" required></div>
                    <div id="edit-project-service-fee-container" class="hidden"><label class="block text-sm font-medium text-gray-700 mb-1">签约服务费（A类）</label><input type="number" id="edit-project-service-fee" step="0.01" min="0"></div>
                    <div id="edit-project-episodes-container" class="hidden"><label class="block text-sm font-medium text-gray-700 mb-1">集数（B类）</label><input type="number" id="edit-project-episodes" min="1"></div>
                </div>
                <div class="flex gap-2 mt-6"><button type="button" onclick="closeModal('edit-project-modal')" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300 transition">取消</button><button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">保存</button></div>
            </form>
        </div>
    </div>

    <div id="add-project-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg max-w-md w-full max-h-[90vh] overflow-y-auto p-6">
            <h3 class="text-xl font-bold mb-4">新增项目</h3>
            <form id="add-project-form" onsubmit="handleAddProjectSubmit(event)">
                <div class="space-y-3">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">项目名称 *</label><input type="text" id="add-project-name" required></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">项目类型 *</label><select id="add-project-type" required onchange="toggleAddProjectFields()"><option value="A">A类</option><option value="B">B类</option></select></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">制作费预算 *</label><input type="number" id="add-project-budget-production" step="0.01" min="0" required></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">差旅（央视网）预算</label><input type="number" id="add-project-budget-travel-cctv" step="0.01" min="0" value="0"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">北京交通费预算</label><input type="number" id="add-project-budget-transport" step="0.01" min="0" value="0"></div>
                    <div id="add-project-service-fee-container" class="hidden"><label class="block text-sm font-medium text-gray-700 mb-1">签约服务费（A类）</label><input type="number" id="add-project-service-fee" step="0.01" min="0"></div>
                    <div id="add-project-episodes-container" class="hidden"><label class="block text-sm font-medium text-gray-700 mb-1">集数（B类）</label><input type="number" id="add-project-episodes" min="1"></div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        function formatMoney(amount) { return '¥' + amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
        function getToday() { return new Date().toISOString().split('T')[0]; }
        function getCategoryLabel(c) { return {'production':'制作费','travel_cctv':'差旅央视网','travel_camera':'差旅摄像团队','transport':'北京交通费'}[c]||c; }
        function getCategoryIcon(c) { return {'production':'🎬','travel_cctv':'✈️','travel_camera':'📷','transport':'🚗'}[c]||'💰'; }
        function evalAmount(input) {
            const raw = input.value.trim();
            if (!raw) return;
            // 只允许数字、小数点、加减乘除、括号、空格，防止代码注入
            if (/^[\d\s\+\-\*\/\.\(\)]+$/.test(raw)) {
                try {
                    const result = Function('"use strict"; return (' + raw + ')')();
                    if (typeof result === 'number' && isFinite(result) && result >= 0) {
                        input.value = parseFloat(result.toFixed(2));
                    }
                } catch(e) { /* 表达式无效，不处理 */ }
            }
        }

        // 计算某项目某类目的剩余预算
        function getRemainingBudget(projectId, category) {
            if (!projectId || !category) return null;
            const data = getData();
            const p = data.projects.find(x => x.id === projectId);
            if (!p) return null;
            const exps = data.expenses.filter(e => e.project_id === projectId);
            let budget, used;
            if (category === 'transport') {
                budget = p.budget_transport;
                used = exps.filter(e => e.category === 'transport').reduce((s, e) => s + e.amount, 0);
            } else if (category === 'travel_cctv') {
                budget = p.budget_travel_cctv;
                used = exps.filter(e => e.category === 'travel_cctv').reduce((s, e) => s + e.amount, 0);
            } else {
                // production / travel_camera 共享 budget_production
                budget = p.budget_production;
                used = exps.filter(e => e.category === 'production' || e.category === 'travel_camera').reduce((s, e) => s + e.amount, 0);
            }
            return { budget, used, remaining: budget - used };
        }

        // 实时更新剩余预算提示
        function updateBudgetHint() {
            const hintEl = document.getElementById('entry-budget-hint');
            const pid = document.getElementById('entry-project').value;
            const catEl = document.querySelector('input[name="category"]:checked');
            const cat = catEl ? catEl.value : null;
            const amtRaw = parseFloat(document.getElementById('entry-amount').value);

            if (!pid || !cat) { hintEl.classList.add('hidden'); return; }
            const info = getRemainingBudget(pid, cat);
            if (!info) { hintEl.classList.add('hidden'); return; }

            const amt = isNaN(amtRaw) ? 0 : amtRaw;
            hintEl.classList.remove('hidden');
            if (amt > 0 && amt > info.remaining) {
                hintEl.className = 'text-xs mt-1 text-red-600 font-semibold';
                hintEl.textContent = `⚠️ 超支！本类目剩余 ${formatMoney(info.remaining)}，录入后将超支 ${formatMoney(amt - info.remaining)}`;
            } else if (amt > 0) {
                hintEl.className = 'text-xs mt-1 text-green-600';
                hintEl.textContent = `本类目剩余预算：${formatMoney(info.remaining)}，录入后剩余 ${formatMoney(info.remaining - amt)}`;
            } else {
                hintEl.className = 'text-xs mt-1 text-gray-500';
                hintEl.textContent = `本类目剩余预算：${formatMoney(info.remaining)}`;
            }
        }

        // 已收票勾选变化：显示/隐藏预计付款日期（仅制作费类目）
        function onInvoiceChange() {
            const isProduction = (document.querySelector('input[name="category"]:checked')?.value === 'production');
            const checked = document.getElementById('entry-invoice').checked;
            const show = isProduction && checked;
            document.getElementById('entry-expected-pay-date').classList.toggle('hidden', !show);
            document.getElementById('entry-expected-pay-label').classList.toggle('hidden', !show);
        }

        // 已付款勾选变化：显示/隐藏实际付款日期（仅制作费类目）
        function onPaidChange() {
            const isProduction = (document.querySelector('input[name="category"]:checked')?.value === 'production');
            const checked = document.getElementById('entry-paid').checked;
            const show = isProduction && checked;
            const dateEl = document.getElementById('entry-paid-date');
            const labelEl = document.getElementById('entry-paid-date-label');
            dateEl.classList.toggle('hidden', !show);
            labelEl.classList.toggle('hidden', !show);
            if (show && !dateEl.value) dateEl.value = getToday(); // 默认今天
        }

        const STORAGE_KEY = 'project_accounting_v1';
        const INITIAL_PROJECTS = [
            {name:"《中国向上·探未来》-北大",type:"A",budget_production:60000,budget_travel_cctv:0,budget_transport:0},
            {name:"《中国有AI》-钉钉",type:"A",budget_production:99700,budget_travel_cctv:20000,budget_transport:0},
            {name:"《中国100行》-军马",type:"B",episodes:8,budget_production:208000,budget_travel_cctv:28000,budget_transport:4000},
            {name:"《中储粮2026》-溯源",type:"B",episodes:3,budget_production:164000,budget_travel_cctv:36000,budget_transport:0},
            {name:"《腾讯2026》",type:"A",budget_production:213000,budget_travel_cctv:25200,budget_transport:1800},
            {name:"《此刻中国》-华为",type:"B",episodes:null,budget_production:315000,budget_travel_cctv:10000,budget_transport:0},
            {name:"《此刻中国》-天齐锂业",type:"A",budget_production:205000,budget_travel_cctv:0,budget_transport:0},
            {name:"《Aging China》-样片",type:"A",budget_production:179000,budget_travel_cctv:21150,budget_transport:1350},
            {name:"《中邮保险7.8宣传日》",type:"A",budget_production:70000,budget_travel_cctv:0,budget_transport:0}
        ];
        const INITIAL_TAXI_ROUTES = [{from:"望海楼（北京市海淀区西三环中路10号）",to:"融创亦庄壹号",amount:110,reason:"加班回家"}];

        // ==================== 云端数据层（GitHub Gist API）====================
        // Token 和 Gist ID 存在 localStorage，不硬编码在代码里（安全）
        // 每台设备首次使用需配置一次，之后自动读取
        const GIST_ID = 'abdc394e92c6cc9744954795e09197bf';
        const GIST_FILE = 'accounting_data.json';
        let _githubToken = null;
        let _memCache = null;

        function getToken() {
            if (_githubToken) return _githubToken;
            _githubToken = localStorage.getItem('gh_token');
            return _githubToken;
        }

        async function initializeData() {
            showLoadingOverlay(true);
            try {
                // 检查是否已配置 Token
                if (!getToken()) {
                    showLoadingOverlay(false);
                    await showTokenSetupDialog();
                    return;
                }
                // 从 Gist 读取数据
                const resp = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'Accept': 'application/vnd.github+json' }
                });
                if (!resp.ok) {
                    if (resp.status === 401) {
                        localStorage.removeItem('gh_token');
                        _githubToken = null;
                        showLoadingOverlay(false);
                        alert('Token 已失效，请重新配置');
                        await showTokenSetupDialog();
                        return;
                    }
                    throw new Error('Gist 读取失败: ' + resp.status);
                }
                const gist = await resp.json();
                const content = gist.files[GIST_FILE]?.content;
                _memCache = content && content !== '{}' ? JSON.parse(content) : null;

                if (!_memCache) {
                    // Gist 无数据，检查 localStorage 是否有旧数据（迁移）
                    const local = localStorage.getItem(STORAGE_KEY);
                    if (local) {
                        _memCache = JSON.parse(local);
                        await saveData(_memCache);
                        alert('已将本地数据自动迁移到云端 ✅');
                    } else {
                        _memCache = {
                            projects: INITIAL_PROJECTS.map(p=>({id:generateUUID(),...p,contract_service_fee:null,archived:false,created_at:new Date().toISOString()})),
                            expenses: [],
                            taxiRoutes: INITIAL_TAXI_ROUTES.map(r=>({id:generateUUID(),...r}))
                        };
                        await saveData(_memCache);
                    }
                }
            } catch(e) {
                console.warn('云端读取失败，降级到localStorage', e);
                const local = localStorage.getItem(STORAGE_KEY);
                if (local) _memCache = JSON.parse(local);
                else {
                    _memCache = {
                        projects: INITIAL_PROJECTS.map(p=>({id:generateUUID(),...p,contract_service_fee:null,archived:false,created_at:new Date().toISOString()})),
                        expenses: [],
                        taxiRoutes: INITIAL_TAXI_ROUTES.map(r=>({id:generateUUID(),...r}))
                    };
                }
            } finally {
                showLoadingOverlay(false);
            }
        }

        function getData() { return _memCache; }

        async function saveData(d) {
            _memCache = d;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); // 本地备份
            if (!getToken()) return;
            try {
                await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(d) } } })
                });
            } catch(e) { console.warn('云端保存失败，数据已保留在本地缓存', e); }
        }

        function showLoadingOverlay(show) {
            let el = document.getElementById('loading-overlay');
            if (!el) {
                el = document.createElement('div');
                el.id = 'loading-overlay';
                el.style.cssText = 'position:fixed;inset:0;background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;z-index:9999;font-size:16px;color:#374151;';
                el.innerHTML = '⏳ 连接云端数据...';
                document.body.appendChild(el);
            }
            el.style.display = show ? 'flex' : 'none';
        }

        function showTokenSetupDialog() {
            return new Promise(resolve => {
                let modal = document.getElementById('token-setup-modal');
                if (!modal) {
                    modal = document.createElement('div');
                    modal.id = 'token-setup-modal';
                    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
                    modal.innerHTML = `
                        <div style="background:white;border-radius:12px;padding:24px;max-width:400px;width:100%;">
                            <h2 style="font-size:18px;font-weight:bold;margin-bottom:8px;">首次配置</h2>
                            <p style="color:#6b7280;font-size:14px;margin-bottom:16px;">请输入你的 GitHub Personal Access Token，数据将安全存储在你的私有 Gist 中。Token 只保存在本设备，不会上传。</p>
                            <input id="token-input" type="password" placeholder="ghp_xxxxxxxxxxxxxxxx" style="width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px;font-size:14px;margin-bottom:12px;box-sizing:border-box;">
                            <button onclick="confirmToken()" style="width:100%;background:#1d4ed8;color:white;border:none;border-radius:8px;padding:12px;font-size:14px;cursor:pointer;font-weight:600;">确认</button>
                        </div>`;
                    document.body.appendChild(modal);
                }
                modal.style.display = 'flex';
                window._tokenSetupResolve = async () => {
                    const token = document.getElementById('token-input').value.trim();
                    if (!token) { alert('请输入 Token'); return; }
                    localStorage.setItem('gh_token', token);
                    _githubToken = token;
                    modal.style.display = 'none';
                    showLoadingOverlay(true);
                    await initializeData();
                    resolve();
                };
            });
        }

        function confirmToken() { window._tokenSetupResolve && window._tokenSetupResolve(); }

        let currentProjectId = null;
        function showPage(name) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            document.getElementById('page-'+name).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
            document.querySelector(`[data-page="${name}"]`).classList.add('active');
            if(name==='overview') renderOverview();
            if(name==='entry') initEntryForm();
            if(name==='taxi') initTaxiPage();
            if(name==='settings') renderSettingsProjects();
            if(name==='detail') { if(currentProjectId) renderProjectDetail(currentProjectId); else renderAlerts(); }
        }

        function renderAlerts() {
            const data = getData();
            document.getElementById('detail-project-name').textContent = '⚠️ 预警中心';
            const el = document.getElementById('detail-content');
            el.innerHTML = '';

            const alerts = []; // {level:'red'|'orange'|'yellow', title, items:[{project, text}]}

            // ① 制作费未支出（有预算但0支出）
            const noProdItems = data.projects.filter(p => !p.archived && p.budget_production > 0).map(p => {
                const spent = data.expenses.filter(e => e.project_id === p.id && (e.category === 'production' || e.category === 'travel_camera')).reduce((s,e)=>s+e.amount,0);
                return spent === 0 ? p : null;
            }).filter(Boolean);
            if (noProdItems.length > 0) {
                alerts.push({
                    level: 'red',
                    icon: '🔴',
                    title: '制作费未支出',
                    hint: '请关注：是否完成采购手续？是否具备验收条件？是否已提交验收材料？',
                    items: noProdItems.map(p => ({ name: p.name, text: `制作费预算 ${formatMoney(p.budget_production)}，暂无支出记录` }))
                });
            }

            // ② 差旅央视网：有记录但未完成报销（cctv_reimbursed=false）
            const cctvPending = data.expenses.filter(e => e.category === 'travel_cctv' && !e.cctv_reimbursed);
            if (cctvPending.length > 0) {
                const total = cctvPending.reduce((s,e)=>s+e.amount,0);
                alerts.push({
                    level: 'orange',
                    icon: '🟠',
                    title: '差旅（央视网）待报销',
                    hint: '以下记录尚未完成报销，请尽快提交报销流程。',
                    items: cctvPending.map(e => {
                        const p = data.projects.find(x=>x.id===e.project_id);
                        const step = !e.cctv_invoice ? '未收票' : !e.cctv_filed ? '未填报' : !e.cctv_submitted ? '未提交' : '未完成报销';
                        return { name: p ? p.name : '未知项目', text: `${e.date} ${formatMoney(e.amount)}${e.description?'（'+e.description+'）':''} — 当前状态：${step}` };
                    })
                });
            }

            // ③ 北京交通费：有记录但未完成报销（transport_reimbursed=false）
            const transPending = data.expenses.filter(e => e.category === 'transport' && !e.transport_reimbursed);
            if (transPending.length > 0) {
                alerts.push({
                    level: 'orange',
                    icon: '🟠',
                    title: '北京交通费待报销',
                    hint: '以下记录尚未完成报销，请尽快提交报销流程。',
                    items: transPending.map(e => {
                        const p = data.projects.find(x=>x.id===e.project_id);
                        const step = !e.transport_filed ? '未填报' : !e.transport_submitted ? '未提交' : '未完成报销';
                        return { name: p ? p.name : '未知项目', text: `${e.date} ${formatMoney(e.amount)}${e.transport_route?' 路线：'+e.transport_route:''} — 当前状态：${step}` };
                    })
                });
            }

            // ④ 差旅摄像团队：有记录且未报销给我
            const cameraPending = data.expenses.filter(e => e.category === 'travel_camera' && !e.reimbursed_to_me);
            if (cameraPending.length > 0) {
                const total = cameraPending.reduce((s,e)=>s+e.amount,0);
                alerts.push({
                    level: 'yellow',
                    icon: '🟡',
                    title: '差旅（摄像团队）待处理',
                    hint: `共 ${formatMoney(total)} 待报销给你。请确认：① 此项是否已并入制作费结算？② 尽快向制作方报销费用。`,
                    items: cameraPending.map(e => {
                        const p = data.projects.find(x=>x.id===e.project_id);
                        return { name: p ? p.name : '未知项目', text: `${e.date} ${formatMoney(e.amount)}${e.description?'（'+e.description+'）':''}` };
                    })
                });
            }

            if (alerts.length === 0) {
                el.innerHTML = `<div class="bg-green-50 border border-green-200 rounded-lg p-6 text-center"><div class="text-4xl mb-3">✅</div><div class="text-green-700 font-semibold text-lg">一切正常，暂无预警</div><div class="text-green-600 text-sm mt-1">所有项目预算和报销状态良好</div></div>`;
                return;
            }

            const colorMap = {
                red: { bg: 'bg-red-50', border: 'border-red-300', title: 'text-red-800', hint: 'text-red-600', tag: 'bg-red-100 text-red-700' },
                orange: { bg: 'bg-orange-50', border: 'border-orange-300', title: 'text-orange-800', hint: 'text-orange-600', tag: 'bg-orange-100 text-orange-700' },
                yellow: { bg: 'bg-yellow-50', border: 'border-yellow-300', title: 'text-yellow-800', hint: 'text-yellow-600', tag: 'bg-yellow-100 text-yellow-800' }
            };

            alerts.forEach(alert => {
                const c = colorMap[alert.level];
                let itemsHtml = alert.items.map(item =>
                    `<div class="flex items-start gap-2 py-2 border-b border-dashed last:border-0 ${c.border.replace('border-','border-').replace('-300','-200')}">
                        <span class="text-xs ${c.tag} px-2 py-0.5 rounded-full whitespace-nowrap mt-0.5">${item.name}</span>
                        <span class="text-sm text-gray-700">${item.text}</span>
                    </div>`
                ).join('');
                el.innerHTML += `
                    <div class="${c.bg} border ${c.border} rounded-lg p-4 space-y-2">
                        <div class="flex items-center gap-2">
                            <span class="text-lg">${alert.icon}</span>
                            <span class="font-bold ${c.title} text-base">${alert.title}</span>
                            <span class="ml-auto text-xs ${c.tag} px-2 py-0.5 rounded-full">${alert.items.length}项</span>
                        </div>
                        <div class="text-sm ${c.hint} font-medium">${alert.hint}</div>
                        <div class="space-y-0">${itemsHtml}</div>
                    </div>`;
            });
        }

        function renderOverview() {
            const data = getData();
            // 到期未付款提醒
            const today = getToday();
            const overdue = data.expenses.filter(e =>
                e.category === 'production' && e.invoice_received && !e.paid &&
                e.expected_pay_date && e.expected_pay_date <= today
            );
            let bannerEl = document.getElementById('overdue-banner');
            if (!bannerEl) {
                bannerEl = document.createElement('div');
                bannerEl.id = 'overdue-banner';
                bannerEl.className = 'mx-4 mt-3 p-3 bg-red-50 border border-red-300 rounded-lg text-sm text-red-800 hidden';
                document.getElementById('page-overview').querySelector('.p-4').prepend(bannerEl);
            }
            if (overdue.length > 0) {
                const lines = overdue.map(e => {
                    const p = data.projects.find(x => x.id === e.project_id);
                    return `• ${p ? p.name : '未知项目'}：应付 ${e.expected_pay_date}，${formatMoney(e.amount)}`;
                }).join('<br>');
                bannerEl.innerHTML = `⚠️ <strong>制作费到期未付款（${overdue.length}笔）</strong><br>${lines}`;
                bannerEl.classList.remove('hidden');
            } else {
                bannerEl.classList.add('hidden');
            }
            const activeProjects = data.projects.filter(p=>!p.archived);
            let totalBudget=0, totalUsed=0;
            activeProjects.forEach(project => {
                const exps = data.expenses.filter(e=>e.project_id===project.id);
                const prodUsed = exps.filter(e=>e.category==='production'||e.category==='travel_camera').reduce((s,e)=>s+e.amount,0);
                const travelUsed = exps.filter(e=>e.category==='travel_cctv').reduce((s,e)=>s+e.amount,0);
                const transUsed = exps.filter(e=>e.category==='transport').reduce((s,e)=>s+e.amount,0);
                totalBudget += project.budget_production + project.budget_travel_cctv + project.budget_transport;
                totalUsed += prodUsed + travelUsed + transUsed;
            });
            document.getElementById('overview-total-budget').textContent = formatMoney(totalBudget);
            document.getElementById('overview-total-used').textContent = formatMoney(totalUsed);
            document.getElementById('overview-total-remaining').textContent = formatMoney(totalBudget-totalUsed);

            const listEl = document.getElementById('project-list');
            listEl.innerHTML = '';
            activeProjects.forEach(project => {
                const exps = data.expenses.filter(e=>e.project_id===project.id);
                const prodUsed = exps.filter(e=>e.category==='production'||e.category==='travel_camera').reduce((s,e)=>s+e.amount,0);
                const travelUsed = exps.filter(e=>e.category==='travel_cctv').reduce((s,e)=>s+e.amount,0);
                const transUsed = exps.filter(e=>e.category==='transport').reduce((s,e)=>s+e.amount,0);
                const used = prodUsed+travelUsed+transUsed;
                const budget = project.budget_production+project.budget_travel_cctv+project.budget_transport;
                const remaining = budget-used;
                const pct = budget>0?(used/budget*100):0;
                let color = 'bg-green-500';
                if(pct>=85) color='bg-red-500'; else if(pct>=60) color='bg-orange-500';

                let extra = '';
                if(project.type==='A') {
                    const sf = project.contract_service_fee||0;
                    const profit = budget-sf-used;
                    extra = `<div class="text-sm mt-2"><span class="font-medium">预计利润：</span><span class="${profit>=0?'text-green-600':'text-red-600'} font-bold">${project.contract_service_fee!==null?formatMoney(profit):'待填写签约服务费'}</span></div>`;
                } else {
                    const pending = exps.filter(e=>e.invoice_received&&e.paid&&!e.reimbursed_from_vendor).length;
                    if(pending>0) extra=`<div class="text-sm mt-2"><span class="inline-block bg-red-100 text-red-700 px-2 py-1 rounded-full text-xs font-semibold">待报销 ${pending} 笔</span></div>`;
                }

                const card = document.createElement('div');
                card.className = 'card bg-white border rounded-lg p-4 cursor-pointer';
                card.onclick = ()=>{currentProjectId=project.id;showPage('detail');};
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-lg">${project.name}</h3>
                        <span class="px-2 py-1 rounded-full text-xs font-semibold ${project.type==='A'?'bg-blue-100 text-blue-700':'bg-purple-100 text-purple-700'}">${project.type}类</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-sm mb-2">
                        <div><span class="text-gray-500">预算</span><div class="font-semibold">${formatMoney(budget)}</div></div>
                        <div><span class="text-gray-500">已用</span><div class="font-semibold text-red-600">${formatMoney(used)}</div></div>
                        <div><span class="text-gray-500">剩余</span><div class="font-semibold text-green-600">${formatMoney(remaining)}</div></div>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2 mb-2"><div class="${color} h-2 rounded-full progress-bar" style="width:${Math.min(pct,100)}%"></div></div>
                    ${extra}
                `;
                listEl.appendChild(card);
            });
        }

        function renderBudgetItem(label,budget,used) {
            const remaining=budget-used;
            const pct=budget>0?(used/budget*100):0;
            let color='bg-green-500';
            if(pct>=85) color='bg-red-500'; else if(pct>=60) color='bg-orange-500';
            return `<div><div class="flex justify-between text-sm mb-1"><span class="font-medium">${label}</span><span class="text-gray-600">${formatMoney(used)} / ${formatMoney(budget)}</span></div><div class="w-full bg-gray-200 rounded-full h-2 mb-1"><div class="${color} h-2 rounded-full progress-bar" style="width:${Math.min(pct,100)}%"></div></div><div class="text-xs text-gray-500">剩余：${formatMoney(remaining)}</div></div>`;
        }

        function renderProjectDetail(projectId) {
            const data = getData();
            const project = data.projects.find(p=>p.id===projectId);
            if(!project) return;
            document.getElementById('detail-project-name').textContent = project.name;
            const contentEl = document.getElementById('detail-content');
            contentEl.innerHTML = '';

            const exps = data.expenses.filter(e=>e.project_id===projectId);
            const prodUsed = exps.filter(e=>e.category==='production'||e.category==='travel_camera').reduce((s,e)=>s+e.amount,0);
            const travelCctvUsed = exps.filter(e=>e.category==='travel_cctv').reduce((s,e)=>s+e.amount,0);
            const transUsed = exps.filter(e=>e.category==='transport').reduce((s,e)=>s+e.amount,0);
            const cameraUsed = exps.filter(e=>e.category==='travel_camera').reduce((s,e)=>s+e.amount,0);
            const cameraReimbursed = exps.filter(e=>e.category==='travel_camera'&&e.reimbursed_to_me).reduce((s,e)=>s+e.amount,0);
            const prodReimbursedToMe = exps.filter(e=>e.category==='production'&&e.reimbursed_to_me).reduce((s,e)=>s+e.amount,0);
            const prodPendingToMe = prodUsed - prodReimbursedToMe;

            contentEl.innerHTML += `<div class="bg-white border rounded-lg p-4 space-y-3"><h3 class="font-bold text-gray-700 mb-2">预算面板</h3>${renderBudgetItem('制作费',project.budget_production,prodUsed)}<div class="grid grid-cols-3 gap-2 text-xs ml-1 mt-0"><div>已报销给我：<span class="text-green-600">${formatMoney(prodReimbursedToMe)}</span></div><div class="${prodPendingToMe>0?'text-orange-600 font-semibold':'text-gray-500'}">待报销给我：${formatMoney(prodPendingToMe)}</div></div>${project.budget_travel_cctv>0?renderBudgetItem('差旅（央视网）',project.budget_travel_cctv,travelCctvUsed):''}${project.budget_transport>0?renderBudgetItem('北京交通费',project.budget_transport,transUsed):''}<div class="pt-2 border-t"><div class="text-sm"><span class="font-medium">差旅（摄像团队）：</span></div><div class="grid grid-cols-3 gap-2 text-xs mt-1"><div>已垫付：<span class="text-red-600">${formatMoney(cameraUsed)}</span></div><div>已报销给我：<span class="text-green-600">${formatMoney(cameraReimbursed)}</span></div><div>待报销给我：<span class="text-orange-600">${formatMoney(cameraUsed-cameraReimbursed)}</span></div></div></div></div>`;

            if(project.type==='A') {
                const totalExp = prodUsed+travelCctvUsed+transUsed;
                const sf = project.contract_service_fee||0;
                const profit = (project.budget_production+project.budget_travel_cctv+project.budget_transport)-sf-totalExp;
                const rate = (project.budget_production+project.budget_travel_cctv+project.budget_transport)>0?((profit/(project.budget_production+project.budget_travel_cctv+project.budget_transport))*100).toFixed(2):0;
                contentEl.innerHTML += `<div class="bg-white border rounded-lg p-4 space-y-3"><h3 class="font-bold text-gray-700 mb-2">利润面板（A类）</h3><div class="space-y-2 text-sm"><div class="flex justify-between"><span>制作费合同额：</span><span class="font-semibold">${formatMoney(project.budget_production)}</span></div><div class="flex justify-between items-center"><span>签约服务费：</span><span class="cursor-pointer text-blue-600 hover:underline" onclick="editServiceFee('${project.id}')">${project.contract_service_fee!==null?formatMoney(project.contract_service_fee):'点击填写'}</span></div><div class="flex justify-between"><span>实际总支出：</span><span class="font-semibold text-red-600">${formatMoney(totalExp)}</span></div><div class="pt-2 border-t flex justify-between text-base"><span class="font-bold">预计利润：</span><span class="font-bold ${profit>=0?'text-green-600':'text-red-600'}">${project.contract_service_fee!==null?formatMoney(profit):'待填写签约服务费'}</span></div>${project.contract_service_fee!==null?`<div class="flex justify-between text-sm"><span>利润率：</span><span class="${profit>=0?'text-green-600':'text-red-600'}">${rate}%</span></div>`:''}</div></div>`;
            }

            if(project.type==='B') {
                const pending = exps.filter(e=>e.invoice_received&&e.paid&&!e.reimbursed_from_vendor);
                const completed = exps.filter(e=>e.invoice_received&&e.paid&&e.reimbursed_from_vendor);
                const totalPending = pending.reduce((s,e)=>s+e.amount,0);
                let html = `<div class="bg-white border rounded-lg p-4"><h3 class="font-bold text-gray-700 mb-2">报销追踪（B类）</h3><div class="mb-3 p-3 bg-orange-50 rounded-lg"><div class="text-sm"><span class="font-medium">总待报销金额：</span><span class="text-orange-600 font-bold text-lg">${formatMoney(totalPending)}</span></div></div>`;
                if(pending.length>0) {
                    html += `<div class="space-y-2 mb-3"><h4 class="text-sm font-semibold">待报销列表</h4>`;
                    pending.forEach(e => {
                        html += `<div class="border rounded p-2 text-sm flex justify-between items-center"><div><div class="font-medium">${e.date} ${getCategoryIcon(e.category)} ${getCategoryLabel(e.category)}</div><div class="text-gray-600">${e.description||'无备注'}</div></div><div class="text-right"><div class="font-bold text-red-600">${formatMoney(e.amount)}</div><button onclick="markReimbursed('${e.id}')" class="text-xs bg-blue-600 text-white px-2 py-1 rounded mt-1 hover:bg-blue-700">标记已报销</button></div></div>`;
                    });
                    html += `</div>`;
                }
                if(completed.length>0) {
                    html += `<details class="mt-2"><summary class="cursor-pointer text-sm text-gray-600 hover:text-gray-800">已完成报销历史 (${completed.length}笔)</summary><div class="mt-2 space-y-2">${completed.map(e=>`<div class="border rounded p-2 text-sm flex justify-between"><div>${e.date} ${getCategoryIcon(e.category)} ${getCategoryLabel(e.category)}</div><div class="font-semibold">${formatMoney(e.amount)}</div></div>`).join('')}</div></details>`;
                }
                html += `</div>`;
                contentEl.innerHTML += html;
            }

            const sortedExps = [...exps].sort((a,b)=>new Date(b.date)-new Date(a.date));
            let expHtml = `<div class="bg-white border rounded-lg p-4"><h3 class="font-bold text-gray-700 mb-3">支出明细 (${sortedExps.length}笔)</h3><div class="space-y-2">`;
            if(sortedExps.length===0) expHtml += `<div class="text-center text-gray-500 py-4">暂无支出记录</div>`;
            else sortedExps.forEach(exp => {
                let tags = [];
                if(exp.invoice_received) tags.push('<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">已收票</span>');
                if(exp.paid) tags.push('<span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">已付款</span>');
                if(exp.category==='transport'&&exp.transport_route) tags.push(`<span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded">${exp.transport_route}</span>`);
                expHtml += `<div class="border rounded p-3 flex justify-between items-start"><div class="flex-1"><div class="flex items-center gap-2 mb-1"><span class="text-lg">${getCategoryIcon(exp.category)}</span><span class="font-medium">${exp.date}</span><span class="text-sm text-gray-600">${getCategoryLabel(exp.category)}</span></div><div class="text-sm text-gray-600 mb-1">${exp.description||'无备注'}</div><div class="flex gap-1">${tags.join('')}</div></div><div class="text-right ml-2"><div class="font-bold text-red-600">${formatMoney(exp.amount)}</div><div class="flex gap-1 mt-1"><button onclick="deleteExpense('${exp.id}')" class="text-xs text-red-600 hover:text-red-800">删除</button></div></div></div>`;
            });
            expHtml += `</div></div>`;
            contentEl.innerHTML += expHtml;
        }

        function editServiceFee(pid) {
            const data = getData();
            const p = data.projects.find(x=>x.id===pid);
            const val = prompt('请输入签约服务费金额（留空则清除）:', p.contract_service_fee||'');
            if(val!==null) { p.contract_service_fee = val===''?null:(parseFloat(val)||0); saveData(data); renderProjectDetail(pid); }
        }

        function markReimbursed(eid) {
            const data = getData();
            const e = data.expenses.find(x=>x.id===eid);
            if(e) { e.reimbursed_from_vendor=true; saveData(data); renderProjectDetail(e.project_id); alert('已标记为已向制作方报销'); }
        }

        function deleteExpense(eid) {
            if(!confirm('确定要删除这条支出记录吗？')) return;
            const data = getData();
            data.expenses = data.expenses.filter(e=>e.id!==eid);
            saveData(data);
            if(currentProjectId) renderProjectDetail(currentProjectId);
            alert('已删除');
        }

        function initEntryForm() {
            document.getElementById('entry-date').value = getToday();
            updateEntryFormFields();
        }

        function filterProjectsByCategory(cat) {
            const data = getData();
            const sel = document.getElementById('entry-project');
            const prevVal = sel.value;
            sel.innerHTML = '<option value="">请选择项目</option>';
            data.projects.filter(p => {
                if (p.archived) return false;
                if (cat === 'transport') return p.budget_transport > 0;
                if (cat === 'travel_cctv') return p.budget_travel_cctv > 0;
                return true;
            }).forEach(p => { sel.innerHTML += `<option value="${p.id}">${p.name} (${p.type}类)</option>`; });
            // 尝试保留之前选中的项目
            if (prevVal && sel.querySelector(`option[value="${prevVal}"]`)) sel.value = prevVal;
        }

        function updateEntryFormFields() {
            const cat = document.querySelector('input[name="category"]:checked');
            const catVal = cat ? cat.value : null;

            // 过滤项目列表
            filterProjectsByCategory(catVal);

            const pid = document.getElementById('entry-project').value;
            const data = getData();
            const p = data.projects.find(x=>x.id===pid);

            // 切换状态勾选区域
            const isTransport = catVal === 'transport';
            const isTravelCctv = catVal === 'travel_cctv';
            document.getElementById('status-default').classList.toggle('hidden', isTransport || isTravelCctv);
            document.getElementById('status-travel-cctv').classList.toggle('hidden', !isTravelCctv);
            document.getElementById('status-transport').classList.toggle('hidden', !isTransport);

            if (!isTransport && !isTravelCctv) {
                document.getElementById('entry-reimbursed-vendor-label').classList.toggle('hidden', !p||p.type!=='B');
                const showReimbMe = (catVal==='travel_camera' || catVal==='production');
                document.getElementById('entry-reimbursed-me-label').classList.toggle('hidden', !showReimbMe);
                // A类 production 默认勾选「已报销给我」，B类默认不勾
                if (catVal === 'production') {
                    document.getElementById('entry-reimbursed-me').checked = (p && p.type === 'A');
                }
            }
            document.getElementById('entry-route-container').classList.toggle('hidden', !isTransport);
            // 切换类目时重置制作费日期框（非 production 类目隐藏）
            const isProduction = catVal === 'production';
            if (!isProduction) {
                ['entry-expected-pay-date','entry-expected-pay-label','entry-paid-date','entry-paid-date-label'].forEach(id => document.getElementById(id).classList.add('hidden'));
            } else {
                // production 时，根据勾选状态决定是否显示
                onInvoiceChange();
                onPaidChange();
            }
            // 刷新剩余预算提示
            updateBudgetHint();
        }
        document.querySelectorAll('input[name="category"]').forEach(r=>r.addEventListener('change',updateEntryFormFields));

        function handleExpenseSubmit(event) {
            event.preventDefault();
            const pid = document.getElementById('entry-project').value;
            const date = document.getElementById('entry-date').value;
            const cat = document.querySelector('input[name="category"]:checked').value;
            const amt = parseFloat(document.getElementById('entry-amount').value);
            const desc = document.getElementById('entry-description').value;
            // 超支检查
            const budgetInfo = getRemainingBudget(pid, cat);
            if (budgetInfo && amt > budgetInfo.remaining) {
                const over = formatMoney(amt - budgetInfo.remaining);
                if (!confirm(`⚠️ 本次录入金额超出预算！\n\n本类目剩余：${formatMoney(budgetInfo.remaining)}\n本次录入：${formatMoney(amt)}\n超出：${over}\n\n确定要强制录入吗？`)) return;
            }
            const data = getData();
            const p = data.projects.find(x=>x.id===pid);
            let exp;
            if (cat === 'transport') {
                exp = {
                    id: generateUUID(), project_id: pid, category: cat, amount: amt, date: date, description: desc,
                    transport_filed: document.getElementById('entry-transport-filed').checked,
                    transport_submitted: document.getElementById('entry-transport-submitted').checked,
                    transport_reimbursed: document.getElementById('entry-transport-reimbursed').checked,
                    transport_route: document.getElementById('entry-route').value||null,
                    invoice_received: false, paid: false, reimbursed_from_vendor: false, reimbursed_to_me: false,
                    created_at: new Date().toISOString()
                };
            } else if (cat === 'travel_cctv') {
                exp = {
                    id: generateUUID(), project_id: pid, category: cat, amount: amt, date: date, description: desc,
                    cctv_invoice: document.getElementById('entry-cctv-invoice').checked,
                    cctv_filed: document.getElementById('entry-cctv-filed').checked,
                    cctv_submitted: document.getElementById('entry-cctv-submitted').checked,
                    cctv_reimbursed: document.getElementById('entry-cctv-reimbursed').checked,
                    invoice_received: false, paid: false, reimbursed_from_vendor: false, reimbursed_to_me: false,
                    transport_route: null, created_at: new Date().toISOString()
                };
            } else {
                exp = {
                    id: generateUUID(), project_id: pid, category: cat, amount: amt, date: date, description: desc,
                    invoice_received: document.getElementById('entry-invoice').checked,
                    paid: document.getElementById('entry-paid').checked,
                    expected_pay_date: (cat === 'production' && document.getElementById('entry-invoice').checked)
                        ? (document.getElementById('entry-expected-pay-date').value || null) : null,
                    paid_date: (cat === 'production' && document.getElementById('entry-paid').checked)
                        ? (document.getElementById('entry-paid-date').value || null) : null,
                    reimbursed_from_vendor: p.type==='B'?document.getElementById('entry-reimbursed-vendor').checked:false,
                    reimbursed_to_me: (cat==='travel_camera'||cat==='production')?document.getElementById('entry-reimbursed-me').checked:false,
                    transport_route: null,
                    created_at: new Date().toISOString()
                };
            }
            data.expenses.push(exp);
            saveData(data);
            document.getElementById('expense-form').reset();
            document.getElementById('entry-date').value = getToday();
            document.getElementById('entry-invoice').checked = true;
            updateEntryFormFields();
            alert('录入成功！');
        }

        // 填充起点终点下拉建议
        function populateLocationSuggestions() {
            const fromList = document.getElementById('taxi-from-list');
            const toList = document.getElementById('taxi-to-list');
            if (!fromList || !toList) return;

            // 起点：公司 + 常用出发地
            let fromOptions = [...BEIJING_LOCATIONS.office];
            const data = getData();
            // 从历史打车记录中学习常用起点
            const learnedFroms = new Set(data.expenses.filter(e => e.category === 'transport' && e.transport_route).map(e => {
                const parts = e.transport_route.split('→');
                return parts[0] ? parts[0].trim() : null;
            }).filter(Boolean));
            learnedFroms.forEach(loc => { if (!fromOptions.includes(loc)) fromOptions.push(loc); });

            // 终点：家 + 文化园 + 产业园 + 大厦 + 央企 + 学习到的目的地
            let toOptions = [...BEIJING_LOCATIONS.home, ...BEIJING_LOCATIONS.cultural_park, ...BEIJING_LOCATIONS.industrial_park, ...BEIJING_LOCATIONS.building, ...BEIJING_LOCATIONS.soe];
            const learnedTos = new Set(data.expenses.filter(e => e.category === 'transport' && e.transport_route).map(e => {
                const parts = e.transport_route.split('→');
                return parts[1] ? parts[1].trim() : null;
            }).filter(Boolean));
            learnedTos.forEach(loc => { if (!toOptions.includes(loc)) toOptions.push(loc); });

            fromList.innerHTML = fromOptions.map(l => `<option value="${l}">`).join('');
            toList.innerHTML = toOptions.map(l => `<option value="${l}">`).join('');
        }

        // 根据里程+类型（回家/公干）从数据库推荐地点
        function suggestByMileageAndType(mileage, type) {
            if (!mileage || mileage <= 0) return null;
            const keys = Object.keys(ROUTE_DATABASE).map(Number).sort((a,b) => a - b);
            // 找到最接近的里程段（误差±1公里）
            let closestKey = null;
            for (const k of keys) {
                if (Math.abs(k - mileage) <= 1.0) { closestKey = k; break; }
            }
            if (!closestKey) return null;
            const segment = ROUTE_DATABASE[closestKey];
            if (!segment) return null;
            const options = type === 'home' ? segment.home : segment.work;
            if (!options || options.length === 0) return null;
            // 随机选择一个
            return options[Math.floor(Math.random() * options.length)];
        }

        // 双向智能推荐：根据已知信息推断未知端
        function suggestDestinationByMileage() {
            const fromInput = document.getElementById('taxi-from').value.trim();
            const toInput = document.getElementById('taxi-to').value.trim();
            const mileage = parseFloat(document.getElementById('taxi-mileage').value);
            const timeInput = document.getElementById('taxi-time').value;
            
            if (!mileage || mileage <= 0) return;
            
            const isWorkday = document.getElementById('taxi-is-workday').checked;
            let isHomeTime = false;
            if (timeInput && isWorkday) {
                const [h, m] = timeInput.split(':').map(Number);
                const tv = h * 60 + m;
                isHomeTime = tv >= 20 * 60 + 30; // 工作日 20:30 后算回家时间
            }
            
            const type = isHomeTime ? 'home' : 'work';
            
            // 场景1：已知起点是望海楼 → 推荐终点
            if (fromInput && fromInput.includes('望海楼') && !toInput) {
                const suggested = suggestByMileageAndType(mileage, type);
                if (suggested) {
                    document.getElementById('taxi-to').value = suggested;
                    generateTaxiSuggestion();
                }
            }
            // 场景2：已知终点在数据库中 → 反推起点为望海楼
            else if (toInput && !fromInput) {
                // 检查终点是否在数据库的任何里程段中
                let foundInDB = false;
                for (const key in ROUTE_DATABASE) {
                    const seg = ROUTE_DATABASE[key];
                    if (seg.home.includes(toInput) || seg.work.includes(toInput)) {
                        foundInDB = true;
                        break;
                    }
                }
                if (foundInDB) {
                    document.getElementById('taxi-from').value = BEIJING_LOCATIONS.office[0];
                    generateTaxiSuggestion();
                }
            }
            // 场景3：已知起终点都不是望海楼，但里程匹配 → 不自动填充，让用户手动确认
        }

        function generateTaxiSuggestion() {
            const ds = document.getElementById('taxi-date').value;
            const ts = document.getElementById('taxi-time').value;
            const wd = document.getElementById('taxi-is-workday').checked;
            const fromInput = document.getElementById('taxi-from').value.trim();
            const toInput = document.getElementById('taxi-to').value.trim();
            if(!ds||!ts) { document.getElementById('taxi-suggestion').classList.add('hidden'); return; }
            document.getElementById('taxi-suggestion').classList.remove('hidden');
            const [h,m] = ts.split(':').map(Number);
            const tv = h*60+m;
            let rule, route, reason;

            // 优先使用用户手动输入的起终点
            let from = fromInput;
            let to = toInput;

            if(wd) {
                if(tv>=20*60+30) {
                    rule='工作日 20:30后 - 加班回家';
                    if (!from) from = BEIJING_LOCATIONS.office[0];
                    if (!to) to = BEIJING_LOCATIONS.home[0];
                    reason='加班回家';
                } else {
                    rule='工作日其他时段 - 外出办公';
                    if (!from) from = BEIJING_LOCATIONS.office[0];
                    if (!to) to = '[客户地址]';
                    reason='外出拜访/开会/前采';
                }
            } else {
                rule='周末/节假日';
                if (!from) from = '[公司地址]';
                if (!to) to = '[目的地]';
                reason='周末加班/紧急事务';
            }

            route = `${from} → ${to}`;
            document.getElementById('taxi-rule-text').textContent = rule;
            document.getElementById('taxi-route-text').textContent = route;
            document.getElementById('taxi-reason-text').textContent = reason;
            updateTaxiProjectSelect();
        }

            const blob = new Blob([json], {type: 'application/json'});
            const file = new File([blob], fileName, {type: 'application/json'});
            if (navigator.share && navigator.canShare && navigator.canShare({files: [file]})) {
                try {
                    await navigator.share({ files: [file], title: '项目记账数据', text: '请在 Safari 中打开此文件，然后在设置页点击「导入数据」' });
                } catch(e) {
                    if (e.name !== 'AbortError') { exportData(); }

        }

        function exportExcel() {
            if (typeof XLSX === 'undefined') { alert('Excel 库加载中，请稍后再试'); return; }
            const data = getData();
            const wb = XLSX.utils.book_new();

            // Sheet1：支出明细
            const expRows = [['项目名称','类型','日期','支出类目','金额','备注','已收票','已付款','已向制作方报销','路线']];
            data.expenses.forEach(e => {
                const p = data.projects.find(x=>x.id===e.project_id);
                expRows.push([
                    p ? p.name : '未知项目',
                    p ? p.type+'类' : '',
                    e.date,
                    getCategoryLabel(e.category),
                    e.amount,
                    e.description || '',
                    e.invoice_received ? '是' : '否',
                    e.paid ? '是' : '否',
                    e.reimbursed_from_vendor ? '是' : '否',
                    e.transport_route || ''
                ]);
            });
            const ws1 = XLSX.utils.aoa_to_sheet(expRows);
            ws1['!cols'] = [{wch:20},{wch:6},{wch:12},{wch:12},{wch:10},{wch:20},{wch:8},{wch:8},{wch:14},{wch:30}];
            XLSX.utils.book_append_sheet(wb, ws1, '支出明细');

            // Sheet2：项目汇总
            const sumRows = [['项目名称','类型','制作费预算','差旅预算','交通预算','总预算','制作费已用','差旅已用','交通已用','总已用','剩余','签约服务费','预计利润','待报销笔数']];
            data.projects.filter(p=>!p.archived).forEach(p => {
                const exps = data.expenses.filter(e=>e.project_id===p.id);
                const prodUsed = exps.filter(e=>e.category==='production'||e.category==='travel_camera').reduce((s,e)=>s+e.amount,0);
                const travelUsed = exps.filter(e=>e.category==='travel_cctv').reduce((s,e)=>s+e.amount,0);
                const transUsed = exps.filter(e=>e.category==='transport').reduce((s,e)=>s+e.amount,0);
                const totalBudget = p.budget_production+p.budget_travel_cctv+p.budget_transport;
                const totalUsed = prodUsed+travelUsed+transUsed;
                const profit = p.type==='A'&&p.contract_service_fee!==null ? totalBudget-p.contract_service_fee-totalUsed : null;
                const pendingCount = exps.filter(e=>e.invoice_received&&e.paid&&!e.reimbursed_from_vendor).length;
                sumRows.push([
                    p.name, p.type+'类',
                    p.budget_production, p.budget_travel_cctv, p.budget_transport, totalBudget,
                    prodUsed, travelUsed, transUsed, totalUsed, totalBudget-totalUsed,
                    p.contract_service_fee ?? '未填写',
                    profit !== null ? profit : (p.type==='A' ? '待填签约服务费' : 'N/A'),
                    p.type==='B' ? pendingCount : 'N/A'
                ]);
            });
            const ws2 = XLSX.utils.aoa_to_sheet(sumRows);
            ws2['!cols'] = [{wch:22},{wch:6},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:12},{wch:14},{wch:12}];
            XLSX.utils.book_append_sheet(wb, ws2, '项目汇总');

            XLSX.writeFile(wb, `项目记账_${getToday()}.xlsx`);
        }

        function exportTaxiExcel() {
            if (typeof XLSX === 'undefined') { alert('Excel 库加载中，请稍后再试'); return; }
            const data = getData();
            const wb = XLSX.utils.book_new();
            const rows = [['日期','项目','路线','里程(km)','金额','备注']];
            data.expenses.filter(e => e.category === 'transport').sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
                const p = data.projects.find(x=>x.id===e.project_id);
                rows.push([
                    e.date,
                    p ? p.name : '未知项目',
                    e.transport_route || '',
                    e.mileage || '',
                    e.amount,
                    e.description || ''
                ]);
            });
            const ws = XLSX.utils.aoa_to_sheet(rows);
            ws['!cols'] = [{wch:12},{wch:22},{wch:35},{wch:10},{wch:10},{wch:20}];
            XLSX.utils.book_append_sheet(wb, ws, '打车记录');
            XLSX.writeFile(wb, `打车记录_${getToday()}.xlsx`);
        }

        function importData(event) {
            const file = event.target.files[0];
            if(!file) return;
            if(!confirm('导入将覆盖现有数据，确定继续吗？')) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if(data.projects&&data.expenses&&data.taxiRoutes) {
                        saveData(data);
                        alert('数据导入成功');
                        location.reload();
                    } else alert('文件格式错误');
                } catch(err) { alert('文件解析失败'); }
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if(!confirm('⚠️ 此操作将永久删除所有数据，不可恢复！确定继续吗？')) return;
            if(!confirm('再次确认：真的要清空所有数据吗？')) return;
            localStorage.removeItem(STORAGE_KEY);
            alert('数据已清空，页面将刷新');
            location.reload();
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        // 初始化
        initializeData().then(() => renderOverview());
    </script>
</body>
</html>
